# Runs the full check (typecheck, tests, build up to date) on every pull request
# and every push to main, so a change is checked before it merges and not only
# when a release is tagged.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check
        run: npm run check
